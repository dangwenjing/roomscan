name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # GitHub 的 ubuntu runner 自带 Android SDK;这里不用 gradlew,直接用指定版本的 Gradle
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk RoomScan-debug.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: RoomScan-debug
          path: RoomScan-debug.apk

      # 同时发到 Releases 的 "latest" 标签,手机浏览器直接打开就能下载,不用登录 GitHub
      - name: Publish to Releases (latest)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: RoomScan latest build
          body: 'Debug APK,自动构建于 ${{ github.sha }}'
          files: RoomScan-debug.apk
          prerelease: true
